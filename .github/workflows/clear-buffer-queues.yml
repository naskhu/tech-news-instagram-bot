name: Clear Buffer Queues

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clear-buffer-queues
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Clear all Buffer queues
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_THREADS_CHANNEL_ID: ${{ secrets.BUFFER_THREADS_CHANNEL_ID }}
          CLEAR_STATUSES: buffer,error,draft
        run: |
          if [ -z "$BUFFER_ACCESS_TOKEN" ]; then
            echo "BUFFER_ACCESS_TOKEN secret is missing" >&2
            exit 1
          fi
          python3 clear_buffer_queues.py
