name: Clear Buffer Queues

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Buffer channel queue(s) to clear
        required: true
        type: choice
        options:
          - instagram
          - threads
          - all
        default: instagram

permissions:
  contents: read

concurrency:
  group: clear-buffer-queues
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Clear Buffer queue(s)
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ORGANIZATION_ID: "6a61ca7301d13814db599d28"
          CLEAR_STATUSES: scheduled,sending,error,draft,needs_approval
          CLEAR_TARGET: ${{ inputs.target }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_THREADS_CHANNEL_ID: ${{ secrets.BUFFER_THREADS_CHANNEL_ID }}
        run: |
          if [ -z "$BUFFER_ACCESS_TOKEN" ]; then
            echo "BUFFER_ACCESS_TOKEN secret is missing" >&2
            exit 1
          fi

          case "$CLEAR_TARGET" in
            instagram)
              if [ -z "$BUFFER_CHANNEL_ID" ]; then
                echo "BUFFER_CHANNEL_ID secret is missing" >&2
                exit 1
              fi
              unset BUFFER_THREADS_CHANNEL_ID
              echo "Clearing Instagram Buffer queue only ($BUFFER_CHANNEL_ID)"
              ;;
            threads)
              if [ -z "$BUFFER_THREADS_CHANNEL_ID" ]; then
                echo "BUFFER_THREADS_CHANNEL_ID secret is missing" >&2
                exit 1
              fi
              unset BUFFER_CHANNEL_ID
              echo "Clearing Threads Buffer queue(s) only ($BUFFER_THREADS_CHANNEL_ID)"
              ;;
            all)
              echo "Clearing Instagram + Threads Buffer queues"
              ;;
            *)
              echo "Unknown CLEAR_TARGET=$CLEAR_TARGET" >&2
              exit 1
              ;;
          esac

          python3 clear_buffer_queues.py
