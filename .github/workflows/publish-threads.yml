name: Publish to Threads

on:
  workflow_run:
    workflows:
      - Generate Tech News Post V2
    types: [completed]
  workflow_dispatch:
    inputs:
      max_posts:
        description: Maximum unpublished posts to publish to Threads (all = drain today's queue under 250/24h before midnight; never previous days)
        required: false
        default: "all"
  schedule:
    # Hourly backup tick (V2 already triggers publish after each generate).
    # FIFO dueAt within the next hour; never past Maldives midnight.
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: threads-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out latest generated content from git
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to latest main commit
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Publishing Threads from commit $(git rev-parse --short HEAD)"
          echo "Queued PNGs under output/:"
          find output -type f -name '*.png' 2>/dev/null | sort || true

      - name: Choose Threads publish plan
        id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MANUAL_MAX_POSTS: ${{ inputs.max_posts || 'all' }}
          # Needed so pending count knows about dual-channel fan-out.
          BUFFER_THREADS_CHANNEL_ID: ${{ secrets.BUFFER_THREADS_CHANNEL_ID }}
          THREADS_DAILY_LIMIT: "250"
          THREADS_MAX_PER_SCHEDULE_TICK: "250"
          THREADS_MAX_PER_GENERATE_TICK: "250"
          THREADS_SCHEDULE_WINDOW_SECONDS: "3600"
          THREADS_FLUSH_BEFORE_MIDNIGHT_SECONDS: "5400"
          THREADS_SECONDARY_DELAY_SECONDS: "120"
        run: python3 choose_threads_publish_plan.py

      - name: Require Buffer Threads secrets
        id: secrets
        if: steps.plan.outputs.should_publish == 'true'
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_THREADS_CHANNEL_ID: ${{ secrets.BUFFER_THREADS_CHANNEL_ID }}
        run: |
          if [ -z "$BUFFER_ACCESS_TOKEN" ] || [ -z "$BUFFER_THREADS_CHANNEL_ID" ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Threads secrets missing::Set BUFFER_ACCESS_TOKEN and BUFFER_THREADS_CHANNEL_ID (comma-separated Buffer Threads channel ids for dual profiles)."
            exit 0
          fi
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          echo "Threads channel id(s): $BUFFER_THREADS_CHANNEL_ID"

      - name: Set up Python
        if: steps.plan.outputs.should_publish == 'true' && steps.secrets.outputs.has_secrets == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install publisher dependency
        if: steps.plan.outputs.should_publish == 'true' && steps.secrets.outputs.has_secrets == 'true'
        run: python -m pip install --disable-pip-version-check requests==2.32.4

      - name: Publish queued posts to Threads via Buffer
        if: steps.plan.outputs.should_publish == 'true' && steps.secrets.outputs.has_secrets == 'true'
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_THREADS_CHANNEL_ID: ${{ secrets.BUFFER_THREADS_CHANNEL_ID }}
          MAX_POSTS_PER_RUN: ${{ steps.plan.outputs.max_posts }}
          PUBLISH_MODE: ${{ steps.plan.outputs.mode }}
          DRAIN_WITHIN_SECONDS: ${{ steps.plan.outputs.drain_seconds }}
          COMMIT_STATE_EACH_POST: "1"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          THREADS_DAILY_LIMIT: "250"
          THREADS_TOPIC: TechNews
          # FIFO Buffer dueAt evenly spaced within the next hour (clamped to midnight).
          # Plan switches to shareNow flush in the last ~90 minutes so leftovers are not missed.
          THREADS_SCHEDULE_WINDOW_SECONDS: "3600"
          THREADS_FLUSH_BEFORE_MIDNIGHT_SECONDS: "5400"
          # Primary release: news.world.tech, then naskhu ~2 minutes later.
          BUFFER_THREADS_PRIMARY_CHANNEL_ID: "6a64c576e2638b94d7d25d01"
          THREADS_SECONDARY_DELAY_SECONDS: "120"
        run: |
          echo "Pending unpublished posts: ${{ steps.plan.outputs.pending }}"
          echo "Mode: ${{ steps.plan.outputs.mode }}"
          echo "Drain window seconds: ${{ steps.plan.outputs.drain_seconds }}"
          echo "Max posts: ${{ steps.plan.outputs.max_posts }}"
          echo "Used last 24h: ${{ steps.plan.outputs.used_24h }}"
          echo "Quota left: ${{ steps.plan.outputs.quota_left }}"
          echo "Plan reason: ${{ steps.plan.outputs.reason }}"
          python threads_publish.py

      - name: Commit Threads publishing state to git
        if: steps.plan.outputs.should_publish == 'true' && steps.secrets.outputs.has_secrets == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads-posted.json

          if git diff --cached --quiet; then
            echo "No Threads publishing-state change to commit."
            exit 0
          fi

          git commit -m "Record published Threads post"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git checkout --ours threads-posted.json || true
              git add threads-posted.json
              GIT_EDITOR=true git rebase --continue || {
                git rebase --abort
                echo "Rebase conflict could not be resolved."
                exit 1
              }
            fi

            if git push origin HEAD:main; then
              echo "Threads publishing state pushed to git successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 5))
          done

          echo "Unable to push Threads publishing state after five attempts."
          exit 1
